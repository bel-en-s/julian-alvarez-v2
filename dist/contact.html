    <div class="ja-menu-arana">
      <div class="ja-menu-arana__layer" data-layer>
        <div class="ja-menu-arana__scrim" data-scrim></div>

          <svg class="ja-menu-arana__web" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid meet" aria-hidden="true">

            <path class="nine" d="M 612 158 C 660 150 700 175 688 198 C 678 220 660 245 612 258 C 560 268 510 260 520 248 C 530 232 560 200 580 180 C 595 167 605 160 612 158 Z"/>

            <circle class="anchor k4" cx="688" cy="198" r="2.4"/>
            <circle class="anchor k2" cx="520" cy="248" r="2.4"/>

              <path class="dangle g1" d="M 612 258 Q 614 290 608 318 Q 604 332 612 344"/>

              <circle class="dangle-tip t3" cx="694" cy="266" r="1.2"/>

          <a href="/" class="ja-menu-arana__item i0 ja-glow-button">
            <span class="ja-menu-arana__dot"></span>Home

          <a href="/" class="ja-menu-arana__item i1 ja-glow-button">
            <span class="ja-menu-arana__dot"></span>Index

      </div>
    </div>

    <div class="contact-page" id="contactPage">
      <div class="contact-page-bg"></div>
      <div class="contact-stage is-open" id="stage">
        <div class="contact-rig" id="rig">
          <div class="contact-web" aria-hidden="true"></div>
          <form class="contact-panel" id="form" novalidate>
            <div class="contact-knot" aria-hidden="true"></div>
            <div class="contact-eyebrow is-title">HOLA</div>
            <p class="contact-sub">Toda historia empieza con un mensaje. Contanos la tuya.</p>
            <div class="contact-field">
              <label class="contact-label" for="name">Nombre</label>
              <input class="contact-input" id="name" name="name" type="text" placeholder="Tu nombre" autocomplete="name"/>
            </div>
            <div class="contact-field">
              <label class="contact-label" for="email">Email</label>
              <input class="contact-input" id="email" name="email" type="email" placeholder="tu@correo.com" autocomplete="email"/>
            </div>
            <div class="contact-field">
              <label class="contact-label" for="msg">Mensaje</label>
              <textarea class="contact-textarea" id="msg" name="msg" placeholder="Cuéntame…"></textarea>
            </div>
            <button class="contact-submit" id="submitBtn" type="submit">Enviar</button>
            <div class="contact-social">
              <a href="https://www.instagram.com/juliaanalvarez/" target="_blank" rel="noopener noreferrer">Instagram</a>
              <a href="https://www.tiktok.com/@9julianalvarez" target="_blank" rel="noopener noreferrer">TikTok</a>
              <a href="https://x.com/9julianalvarez" target="_blank" rel="noopener noreferrer">X</a>
              <a href="https://www.facebook.com/9juliaanalvarez" target="_blank" rel="noopener noreferrer">Facebook</a>
            </div>
          </form>
        </div>
      </div>
      <div class="contact-thanks" id="thanks" aria-live="polite">
        <div class="contact-thanks-eb">Mensaje enviado</div>
        <h3>Gracias</h3>
        <p>Tu historia ya está acá, la leemos con atención.</p>
      </div>
    </div>

  </body>
