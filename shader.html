<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shader | Julián Alvarez</title>
    <link rel="icon" href="/favicon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .shader-stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, transparent 10%, #51398D 100%);
        isolation: isolate;
      }

      .shader-stage::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 30%;
        pointer-events: none;
        z-index: 10;
        background: linear-gradient(to top, #1F2125 0%, transparent 100%);
      }

      .shader-wrapper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      .shader-wrapper canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .page-texture {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        background-image: url(/Textura.webp);
        background-size: cover;
        background-position: center;
        mix-blend-mode: soft-light;
        opacity: 0.3;
        will-change: transform;
        transform: translateZ(0);
      }
    </style>
  </head>
  <body>
    <div class="shader-stage">
      <div class="page-texture"></div>
    </div>
    <script type="module" src="/script/shader-page.js"></script>
  </body>
</html>
