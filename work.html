<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trayectoria | Julián Alvarez</title>
    <link rel="icon" href="/global/logo-spider.webp" />
    <link rel="stylesheet" href="/globals.css" />
    <link rel="stylesheet" href="/css/transition.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/work.css" />
  </head>
  <body>
    <div class="transition">
      <div class="transition-overlay overlay"></div>
      <div class="transition-logo">
        <img src="/global/logo.png" alt="Logo" />
      </div>
    </div>
    <div class="mask-transition"></div>
    <div class="mask-bg-overlay"></div>

    <nav class="menu">
      <div class="menu-header">
        <img class="menu-logo" src="/global/logo-spider.webp" alt="Julián Alvarez" />
        <div class="ja-menu-arana__fab-wrap">
          <button class="ja-menu-arana__fab" data-fab type="button" aria-label="Abrir menú" aria-expanded="false">
            <span class="ja-menu-arana__hamburger">
              <span class="ja-menu-arana__ham-line"></span>
              <span class="ja-menu-arana__ham-line"></span>
              <span class="ja-menu-arana__ham-line"></span>
            </span>
          </button>
        </div>
      </div>
    </nav>

    <div class="ja-menu-arana">
      <div class="ja-menu-arana__layer" data-layer>
        <div class="ja-menu-arana__scrim" data-scrim></div>
        <div class="ja-menu-arana__frame" data-frame>
          <svg class="ja-menu-arana__web" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <path class="strand s1" d="M 744 52 Q 685 117 618 166"/>
            <path class="strand s2" d="M 744 52 Q 640 158 528 246"/>
            <path class="strand s3" d="M 744 52 Q 685 215 617 343"/>
            <path class="strand s4" d="M 744 52 Q 722 125 691 183"/>
            <path class="auxiliary a1" d="M 744 52 Q 706 80 660 100"/>
            <path class="auxiliary a2" d="M 744 52 Q 660 95 565 120"/>
            <path class="auxiliary a3" d="M 744 52 Q 740 175 730 280"/>
            <path class="auxiliary a4" d="M 744 52 Q 700 250 640 430"/>
            <path class="auxiliary a5" d="M 744 52 Q 670 320 470 360"/>
            <path class="nine" d="M 612 158 C 660 150 700 175 688 198 C 678 220 660 245 612 258 C 560 268 510 260 520 248 C 530 232 560 200 580 180 C 595 167 605 160 612 158 Z"/>
            <circle class="anchor k1" cx="612" cy="158" r="2.4"/>
            <circle class="anchor k4" cx="688" cy="198" r="2.4"/>
            <circle class="anchor k2" cx="520" cy="248" r="2.4"/>
            <circle class="anchor k0" cx="720" cy="55" r="2.4"/>
            <g class="dangles">
              <path class="dangle g1" d="M 612 258 Q 614 290 608 318 Q 604 332 612 344"/>
              <circle class="dangle-tip t1" cx="612" cy="344" r="1.3"/>
              <path class="dangle g2" d="M 520 248 Q 510 282 506 312 Q 504 332 514 344"/>
              <circle class="dangle-tip t2" cx="514" cy="344" r="1.4"/>
              <path class="dangle g3" d="M 688 198 Q 696 222 690 244 Q 686 256 694 266"/>
              <circle class="dangle-tip t3" cx="694" cy="266" r="1.2"/>
            </g>
          </svg>
          <a href="/" class="ja-menu-arana__item i0 ja-glow-button">
            <span class="ja-menu-arana__dot"></span>Home
          </a>
          <a href="/" class="ja-menu-arana__item i1 ja-glow-button">
            <span class="ja-menu-arana__dot"></span>Index
          </a>
          <a href="/about" class="ja-menu-arana__item i4 ja-glow-button">
            <span class="ja-menu-arana__dot"></span>The Dev
          </a>
          <a href="/contact" class="ja-menu-arana__item i2 ja-glow-button">
            <span class="ja-menu-arana__dot"></span>Ping Me
          </a>
        </div>
      </div>
    </div>

    <div class="transition-grid"></div>

    <div class="slider"></div>
    <script type="module" src="/script/lenis-scroll.js"></script>
    <script type="module" src="/script/transition.js"></script>
    <script type="module" src="/script/menu.js"></script>
    <script type="module" src="/script/work.js"></script>
  </body>
</html>
